# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, prefixed with 'os.pathsep' to search for modules
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to associate with 'slug' in
# generate_rev.  Callbacks may change the slug length.
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded with relative paths
# repr_path_in_behavior = false

# version_locations = %(here)s/alembic/versions

# version_path_separator = :

# set to 'true' to search for migrations recursively
# recursive_version_locations = false

sqlalchemy.url = postgresql://postgres.ezjmrpdqgiicfprkgadi:Phish9336006165@aws-1-ap-south-1.pooler.supabase.com:5432/postgres

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %H:%M:%S
