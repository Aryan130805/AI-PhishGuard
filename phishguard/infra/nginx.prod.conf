events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Redirect all HTTP requests to HTTPS
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block with TLS termination
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Certificates (Volume mounted in production)
        # Note: In a production cluster, TLS may be terminated externally (e.g. AWS ALB, Cloudflare, Nginx Ingress).
        # These paths serve as placeholders for Certbot/Let's Encrypt certificates or local custom SSL certs.
        ssl_certificate /etc/nginx/certs/live/phishguard.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/phishguard.com/privkey.pem;

        # Recommended TLS Settings & Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        
        # Serve Frontend built static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Route FastAPI backend (rewrite /api/something -> /something)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
